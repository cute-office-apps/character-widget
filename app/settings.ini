# ===== 캐릭터 위젯 설정 =====
# 대부분은 캐릭터 우클릭 → "설정" 창에서 바꿀 수 있어요. (이 파일은 고급 설정용)

# 기본 이름 (캐릭터마다 이름을 지어주면 그 이름이 우선이에요)
NAME=

# 캐릭터 클릭 시 메모: auto(스티커 메모가 있으면 그걸로) / sticky / builtin(위젯 메모장)
MEMO=auto

# 구글 캘린더 "iCal 형식의 비공개 주소" (…/private-…/basic.ics). 여러 개면 ICAL_URL2= 처럼 추가
ICAL_URL=
# 일정 몇 분 전에 알려줄지 (0 이면 끔)
REMIND_MINUTES=10
# 컴퓨터를 켜둔 채 날이 바뀌면 몇 시에 오늘 일정을 알려줄지 (0~23)
MORNING_HOUR=8

# 캐릭터 키(픽셀)
SIZE=170
# 멈춘 그림도 통통 움직이게 만들기 (on/off)
ANIMATE=on
# 그림 배경 자동으로 지우기 (on/off)
REMOVE_BG=on
# 평소에 둥실둥실 떠 있기 (on/off)
MOTION=on
# 켤 때 인사 (on/off)
GREETING=on
# "캐릭터 랜덤으로 바꾸기"를 켰을 때 몇 분마다 바꿀지 (켜고 끄기는 우클릭 메뉴에서)
RANDOM_MINUTES=30

# 새 버전이 나오면 말풍선으로 알려주기 (on/off)
AUTO_UPDATE=on
